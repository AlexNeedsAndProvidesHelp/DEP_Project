services:
  ollama_server:
    image: ollama/ollama
    container_name: ollama_server
    volumes:
      - ollama_data:/root/.ollama

  db:
    image: postgres:15
    container_name: postgres_db
    restart: on-failure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  web:
    build: .
    container_name: django_app
    restart: on-failure
    depends_on:
      - db
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"  # Port SMTP
      - "8025:8025"  # Interface web pour visualiser les emails capturés
    restart: on-failure

volumes:
  postgres_data:
  ollama_data:
